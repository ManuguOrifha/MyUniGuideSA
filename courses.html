    <script>
      (function () {
        const t = localStorage.getItem('uniPath_theme') || 'dark';

</head>
<body>
    <button type="button" class="menu-btn menu-btn-fixed" id="menuBtn" aria-label="Open menu" title="Menu">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
    </button>

    <div class="side-menu-backdrop" id="menuBackdrop" hidden></div>
    <nav class="side-menu" id="sideMenu" aria-label="Main menu" hidden>
        <div class="side-menu-header">Menu</div>
        <a class="side-menu-item" href="index.html">Home</a>
        <a class="side-menu-item" href="details.html">Your details</a>
        <a class="side-menu-item" href="contact.html">Contact</a>
    </nav>

    <div class="app-container wide">
        <div class="top-bar">
            <h1>MyUniGuideSA</h1>
            <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span class="theme-icon">☀️</span>
                <span class="theme-label">Light mode</span>
            </button>
        </div>
        <div class="subhead">Step 2 of 2 — All courses from all 26 public universities, sorted for you.</div>

        <div class="page-nav">
            <a href="details.html" class="nav-step nav-link">1. Your Details</a>
            <span class="nav-arrow">→</span>
            <span class="nav-step active">2. Your Courses</span>
        </div>

        <div class="card single-card">
            <h2>Recommended courses</h2>
            <div id="resultsContainer"></div>
        </div>

        <div style="text-align:center; margin-top:1.5rem;">
            <a href="details.html" class="btn-secondary" style="text-decoration:none;">← Edit my details</a>
        </div>
    </div>

    <button type="button" id="scrollTopBtn" class="scroll-top-btn" title="Back to top" aria-label="Back to top">↑</button>

    <script src="courses.js"></script>
    <script>
      (function () {
        const scrollBtn = document.getElementById('scrollTopBtn');
        if (scrollBtn) {
          window.addEventListener('scroll', function () {
            scrollBtn.classList.toggle('show', window.scrollY > 400);
          }, { passive: true });
          scrollBtn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        const menuBtn = document.getElementById('menuBtn');
        const menu = document.getElementById('sideMenu');
        const backdrop = document.getElementById('menuBackdrop');
        function openMenu() {
          menu.hidden = false;
          backdrop.hidden = false;
          requestAnimationFrame(function () {
            menu.classList.add('open');
            backdrop.classList.add('open');
          });
        }
        function closeMenu() {
          menu.classList.remove('open');
          backdrop.classList.remove('open');
          setTimeout(function () {
            menu.hidden = true;
            backdrop.hidden = true;
          }, 200);
        }
        menuBtn.addEventListener('click', function () {
          if (menu.classList.contains('open')) closeMenu();
          else openMenu();
        });
        backdrop.addEventListener('click', closeMenu);

        const btn = document.getElementById('themeToggle');
        function applyIcon() {
          const light = document.documentElement.classList.contains('light');
          const icon = btn.querySelector('.theme-icon');
          const label = btn.querySelector('.theme-label');
          if (icon) icon.textContent = light ? '🌙' : '☀️';
          if (label) label.textContent = light ? 'Dark mode' : 'Light mode';
        }
        applyIcon();
        btn.addEventListener('click', function () {
          document.documentElement.classList.toggle('light');
          const light = document.documentElement.classList.contains('light');
          localStorage.setItem('uniPath_theme', light ? 'light' : 'dark');
          applyIcon();
        });
      })();
    </script>
</body>
</html>
